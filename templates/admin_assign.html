{% extends "base.html" %}

{% block title %}Assign Task - Task Manager{% endblock %}

{% block content %}
<div class="header">
    <h1>📝 Assign New Task</h1>
    <div class="nav">
        <a href="{{ url_for('admin_dashboard') }}">Back</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <form method="POST" action="{{ url_for('admin_assign') }}">
            <div class="form-group">
                <label>Task Title *</label>
                <input type="text" name="title" class="form-control" placeholder="e.g., Clean Kitchen" required>
            </div>
            
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" class="form-control" placeholder="Task details..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Assign To *</label>
                <select name="assigned_to" class="form-control" required>
                    <option value="">Select User</option>
                    {% for user in users %}
                    <option value="{{ user._id }}">{{ user.username }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label>Weekday *</label>
                <select name="weekday" class="form-control" required>
                    <option value="">Select Day</option>
                    {% for day in weekdays %}
                    <option value="{{ day }}">{{ day }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" name="due_date" class="form-control">
            </div>
            
            <button type="submit" class="btn btn-primary">Assign Task</button>
        </form>
    </div>
</div>
{% endblock %}
