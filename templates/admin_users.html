{% extends "base.html" %}

{% block title %}Manage Users - Task Manager{% endblock %}

{% block content %}
<div class="header">
    <h1>👥 Manage Users</h1>
    <div class="nav">
        <a href="{{ url_for('admin_dashboard') }}">← Dashboard</a>
        <a href="{{ url_for('admin_assign') }}">+ New Task</a>
        <a href="{{ url_for('admin_archive') }}">📦 Archive</a>
        <a href="{{ url_for('change_password') }}">Change Password</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</div>

<div class="container">
    <!-- Add User -->
    <div class="card">
        <h3 class="card-title">Quick Add User</h3>
        <form method="POST" action="{{ url_for('admin_add_user') }}">
            <div style="display: grid; gap: 10px;">
                <input type="text" name="username" class="form-control" placeholder="Username" required>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
                <input type="email" name="email" class="form-control" placeholder="Email">
                <select name="role" class="form-control">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <button type="submit" class="btn btn-primary btn-sm">Add User</button>
            </div>
        </form>
    </div>

    <!-- Users List -->
    <div class="card">
        <h3 class="card-title">Team Members</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 5px;">
            {% for user in users %}
            <div class="user-chip" style="display: flex; align-items: center; gap: 8px;">
                👤 {{ user.username }}
                <form method="POST" action="{{ url_for('admin_reset_password', user_id=user._id) }}" style="display: inline;">
                    <input type="text" name="new_password" placeholder="New pass" style="width: 80px; padding: 2px 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.8rem;">
                    <button type="submit" class="btn btn-sm" style="padding: 2px 8px; font-size: 0.75rem;">Reset</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
